<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pt.title}}</title>
<meta name="description" content="{{pt.description}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; script-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0a0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4f5" media="(prefers-color-scheme: light)">
<link rel="canonical" href="{{url.canonical}}">
<link rel="alternate" hreflang="fr" href="{{page.alt.fr}}">
<link rel="alternate" hreflang="en" href="{{page.alt.en}}">
<link rel="alternate" hreflang="x-default" href="{{page.alt.fr}}">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ATTACK Launcher">
<meta property="og:locale" content="{{t.meta.ogLocale}}">
<meta property="og:locale:alternate" content="{{t.meta.ogLocaleAlt}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta property="og:title" content="{{pt.title}}">
<meta property="og:description" content="{{pt.description}}">
<meta property="og:url" content="{{url.canonical}}">
<meta property="og:image" content="{{t.meta.ogImage}}">
<meta property="og:image:width" content="1120">
<meta property="og:image:height" content="700">
<meta property="og:image:alt" content="{{t.alt.launcher-home}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="{{root}}fonts/barlow-condensed-800i.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="{{root}}styles.css">
